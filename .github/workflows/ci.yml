name: Verify recovery invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['20.20.2', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run experiments:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retryproof-verification-node-${{ matrix.node }}
          path: evidence/

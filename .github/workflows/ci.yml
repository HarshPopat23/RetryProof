name: Verify recovery invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run experiments:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retryproof-verification
          path: evidence/
